<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Gráfico de Datos</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    {% if datos %}
    <script>
    const datos = {{ datos|tojson }};
    </script>
    {% endif %}
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 text-gray-800 min-h-screen p-6">

    <h1 class="text-3xl md:text-4xl font-extrabold mb-8 text-center text-green-700 tracking-wide">
        📊 Visualización de Datos
    </h1>

    <div class="mb-6 flex flex-col md:flex-row items-center justify-center gap-4">
        <div>
            <label class="block text-sm font-medium text-green-800 mb-1">Desde:</label>
            <input type="date" id="fechaInicio" class="border border-green-300 p-2 rounded-lg shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none"/>
        </div>
        <div>
            <label class="block text-sm font-medium text-green-800 mb-1">Hasta:</label>
            <input type="date" id="fechaFin" class="border border-green-300 p-2 rounded-lg shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none"/>
        </div>
        <button onclick="actualizarGrafico()" class="bg-green-600 text-white px-6 py-2 rounded-lg shadow hover:bg-green-700 transition">
            🔄 Actualizar
        </button>
    </div>

    {% if error %}
        <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-md shadow mb-6 max-w-2xl mx-auto text-center">
            {{ error }}
        </div>
    {% endif %}

    <div class="bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-lg max-w-5xl mx-auto">
        <canvas id="grafico" class="w-full"></canvas>
    </div>

    <div class="mt-10 text-center">
        <a href="/" class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg font-semibold shadow hover:bg-green-700 transition">
            ⬅ Volver al Inicio
        </a>
    </div>

    <script>
        function actualizarGrafico() {
            const desde = document.getElementById('fechaInicio').value;
            const hasta = document.getElementById('fechaFin').value;

            if (!desde || !hasta) {
                alert("Por favor, selecciona ambas fechas.");
                return;
            }

            const url = `/grafico?fechaprimera=${desde}&fechasegunda=${hasta}`;
            window.location.href = url;
        }
    </script>

    <script src="{{ url_for('static', filename='grafico.js') }}"></script>
</body>
</html>
