<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Historial</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 text-gray-800 min-h-screen p-6">

    <h1 class="text-3xl md:text-4xl font-extrabold mb-8 text-center text-green-700 tracking-wide">
        📜 Historial de Datos
    </h1>

    <form method="get" action="/historial_filtrado" 
          class="mb-8 flex flex-col md:flex-row gap-4 justify-center items-center bg-white/80 backdrop-blur-md p-6 rounded-2xl shadow-md max-w-3xl mx-auto">
        <div>
            <label class="block text-sm font-medium text-green-800 mb-1">Desde:</label>
            <input name="fechaprimera" type="date" required 
                   class="border border-green-300 p-2 rounded-lg shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none"/>
        </div>
        <div>
            <label class="block text-sm font-medium text-green-800 mb-1">Hasta:</label>
            <input name="fechasegunda" type="date" required 
                   class="border border-green-300 p-2 rounded-lg shadow-sm focus:ring-2 focus:ring-green-400 focus:outline-none"/>
        </div>
        <button type="submit" 
                class="bg-green-600 text-white px-6 py-2 rounded-lg shadow hover:bg-green-700 transition">
            🔍 Filtrar
        </button>
    </form>

    {% if error %}
        <p class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-md shadow mb-6 text-center max-w-2xl mx-auto">
            {{ error }}
        </p>
    {% elif datos %}
        <div class="overflow-x-auto max-w-5xl mx-auto bg-white/90 backdrop-blur-md rounded-2xl shadow-lg">
            <table class="w-full border border-green-200 rounded-2xl overflow-hidden">
                <thead class="bg-green-600 text-white text-center">
                    <tr>
                        {% for key in datos[0].keys() %}
                            <th class="p-3 border border-green-300">{{ key }}</th>
                        {% endfor %}
                    </tr>
                </thead>
                <tbody>
                    {% for dato in datos %}
                        <tr class="hover:bg-green-50 text-center">
                            {% for value in dato.values() %}
                                <td class="p-3 border border-green-200">{{ value }}</td>
                            {% endfor %}
                        </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    {% else %}
        <p class="text-green-800 text-center mt-6 font-medium">No hay datos para mostrar.</p>
    {% endif %}

    <div class="mt-10 text-center">
        <a href="/" 
           class="inline-block bg-green-600 text-white px-6 py-2 rounded-lg font-semibold shadow hover:bg-green-700 transition">
            ⬅ Volver al Inicio
        </a>
    </div>

    <script src="{{ url_for('static', filename='js/historial.js') }}"></script>
</body>
</html>
