<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Datos Actuales</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-white text-black p-6">
    <h1 class="text-3xl text-[#4B0000] font-bold mb-6">Datos Actuales del Sensor</h1>

    {% if datos %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
            {% for clave, valor in datos.items() %}
                <div class="bg-[#F8F8F8] border border-gray-300 p-4 rounded-lg shadow">
                    <p class="text-lg font-semibold text-[#4B0000]">{{ clave.replace('_', ' ').capitalize() }}</p>
                    <p class="text-2xl text-black">{{ valor }}</p>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-red-500 text-xl">No se encontraron datos actuales.</p>
    {% endif %}

    <div class="mt-6">
        <a href="/" class="text-[#4B0000] underline hover:text-black">Volver al Inicio</a>
    </div>
</body>
</html>
