<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
    <title>Datos Actuales</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 text-gray-800 min-h-screen p-6">

    <h1 class="text-3xl md:text-4xl font-extrabold mb-8 text-center text-green-700 tracking-wide">
        🌿 Datos Actuales del Sensor
    </h1>

    {% if error %}
        <div class="bg-red-50 border-l-4 border-red-500 text-red-700 p-4 rounded-md shadow mb-6">
            <strong class="font-semibold">¡Error!</strong>
            <span class="ml-2">{{ error }}</span>
        </div>
    {% elif datos %}
        <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
            {% for clave, valor in datos.items() %}
                <div class="bg-white/80 backdrop-blur-md border border-green-200 p-6 rounded-2xl shadow-md hover:shadow-lg transition">
                    <p class="text-lg font-semibold text-green-800 mb-2">{{ clave.replace('_', ' ').capitalize() }}</p>
                    <p class="text-3xl font-bold text-green-600">{{ valor }}</p>
                </div>
            {% endfor %}
        </div>
    {% else %}
        <p class="text-green-800 text-xl text-center font-medium mt-6">
            No se encontraron datos actuales.
        </p>
    {% endif %}

    <div class="mt-10 text-center">
        <a href="/" class="inline-block px-6 py-2 text-green-700 border border-green-400 rounded-lg font-semibold hover:bg-green-100 transition">
            ← Volver al Inicio
        </a>
    </div>
</body
