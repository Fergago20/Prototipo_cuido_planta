<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Interfaz N8N</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    .spin {
      border-top-color: transparent;
      animation: spin 1s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body class="bg-gradient-to-br from-green-50 to-green-100 text-gray-800 min-h-screen flex items-center justify-center p-6">

  <div class="w-full max-w-3xl shadow-2xl rounded-3xl p-10 bg-white/90 backdrop-blur-md border-t-8 border-green-600">
    <h1 class="text-4xl font-bold mb-8 text-center text-green-700 tracking-wide">
      🔗 Panel de Comunicación con N8N
    </h1>
    
    <div class="flex flex-col gap-6">
      <!-- Botón Enviar -->
      <button id="btnEnviar" 
              class="bg-green-600 text-white px-6 py-3 text-lg font-semibold rounded-xl shadow hover:bg-green-700 transition flex items-center justify-center gap-3">
        <span>📤 Enviar Datos a N8N</span>
        <span id="spinner" class="w-5 h-5 border-2 border-white rounded-full hidden spin"></span>
      </button>

      <!-- Botón Volver -->
      <a href="/" 
         class="block text-center bg-green-600 text-white px-6 py-3 text-lg font-semibold rounded-xl shadow hover:bg-green-700 transition">
         ⬅ Volver al Inicio
      </a>
    </div>
  </div>

  <script src="{{ url_for('static', filename='chat.js') }}"></script>
</body>
</html>
